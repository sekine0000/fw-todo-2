spring.application.name=todoapp
spring.security.user.name=${AUDIT_ADMIN_USER:admin}
spring.security.user.roles=ADMIN
# Run the additive audit schema on existing databases too (Docker init scripts only run once).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/02_create_transaction_tables.sql,classpath:db/03_create_audit_logs.sql,classpath:db/04_create_todo_templates.sql
spring.datasource.url=jdbc:mysql://localhost:3307/todoapp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:password}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.ai.mcp.server.protocol=STREAMABLE
app.async.report-timeout-ms=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
