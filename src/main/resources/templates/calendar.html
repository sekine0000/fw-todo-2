<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="${calendarTitle}">カレンダー</h1>
        <nav class="calendar-nav" aria-label="カレンダーの操作">
            <div class="calendar-nav-group" th:unless="${weekView}">
                <a class="link" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次の月</a>
            </div>
            <div class="calendar-nav-group" th:if="${weekView}">
                <a class="link" th:href="@{/calendar(view=week,date=${previousWeek})}">前の週</a>
                <a class="link" th:href="@{/calendar(view=week,date=${nextWeek})}">次の週</a>
            </div>
            <div class="calendar-nav-group" aria-label="表示の切り替え">
                <a class="link" th:href="@{/calendar(view=month,date=${anchor})}" th:attr="aria-current=${!weekView ? 'page' : null}">月表示</a>
                <a class="link" th:href="@{/calendar(view=week,date=${anchor})}" th:attr="aria-current=${weekView ? 'page' : null}">週表示</a>
            </div>
            <div class="calendar-nav-group">
                <a class="link" th:href="@{/todos}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay},data-view=${weekView ? 'week' : 'month'}" th:aria-label="${calendarTitle + 'のカレンダー'}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="date : ${week}" th:attr="data-date=${date}">
                        <span th:if="${date != null}" th:text="${weekView ? date.monthValue + '/' + date.dayOfMonth : date.dayOfMonth}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
        <p>現在地の天気（予報のある日のみ）・天気データ：<a href="https://open-meteo.com/">Open-Meteo</a></p>
    </main>
    <script>
        function loadWeather() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async position => {
                const table = document.querySelector('.calendar-table');
                const params = new URLSearchParams({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    from: table.dataset.from,
                    to: table.dataset.to
                });
                try {
                    const res = await fetch(`/api/weather?${params}`, { signal: AbortSignal.timeout(12000) });
                    if (!res.ok || res.headers.has('X-Weather-Unavailable')) return;
                    const weather = await res.json();
                    if (!weather || typeof weather !== 'object') return;
                    for (const cell of table.querySelectorAll('td[data-date]')) {
                        if (!Object.prototype.hasOwnProperty.call(weather, cell.dataset.date)
                                || typeof weather[cell.dataset.date] !== 'string') continue;
                        const text = document.createElement('div');
                        text.textContent = weather[cell.dataset.date];
                        cell.appendChild(text);
                    }
                } catch (error) {
                    // 天気の通信に失敗しても、描画済みのカレンダーはそのまま残す。
                }
            }, () => {
                // 現在地の取得失敗・許可しない場合は、天気だけ省略する。
            }, { timeout: 10000, maximumAge: 300000 });
        }

        async function loadHolidays(table, params) {
            const cells = table.querySelectorAll('td[data-date]');
            for (const cell of cells) {
                if (!cell.dataset.date) continue;
                const day = new Date(`${cell.dataset.date}T00:00:00`).getDay();
                if (day === 6) cell.style.backgroundColor = '#e3f2fd';
                if (day === 0) cell.style.backgroundColor = '#fce4ec';
            }

            function showUnavailable() {
                const message = document.createElement('p');
                message.textContent = '祝日を取れませんでした';
                message.setAttribute('role', 'status');
                document.querySelector('main').prepend(message);
            }

            try {
                const res = await fetch(`/api/holidays?${params}`);
                if (res.headers.has('X-Holidays-Unavailable')) {
                    showUnavailable();
                    return;
                }
                if (!res.ok) throw new Error('祝日を取得できませんでした');
                const holidays = await res.json();
                for (const cell of cells) {
                    if (Object.prototype.hasOwnProperty.call(holidays, cell.dataset.date)) {
                        cell.style.backgroundColor = '#fff3cd';
                        cell.title = holidays[cell.dataset.date];
                    }
                }
            } catch (error) {
                showUnavailable();
                console.error('祝日の読み込みに失敗しました', error);
            }
        }

        async function loadTodos() {
            const table = document.querySelector('.calendar-table');
            const params = new URLSearchParams({
                from: table.dataset.from,
                to: table.dataset.to
            });

            loadHolidays(table, params);

            try {
                const res = await fetch(`/api/todos?${params}`);
                if (!res.ok) {
                    throw new Error('やることを取得できませんでした');
                }
                const todos = await res.json();
                const cells = table.querySelectorAll('td[data-date]');
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                for (const cell of cells) {
                    if (!cell.dataset.date) continue;
                    const dailyTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                    const visibleTodos = table.dataset.view === 'week' ? dailyTodos : dailyTodos.slice(0, 3);
                    for (const todo of visibleTodos) {
                        const title = document.createElement('a');
                        title.href = `/todos/${todo.id}/edit`;
                        title.className = 'calendar-todo link';
                        title.textContent = todo.title;
                        if (todo.dueDate < today && todo.completed === false) {
                            title.style.color = 'red';
                        }
                        cell.appendChild(title);
                    }
                    if (table.dataset.view !== 'week' && dailyTodos.length > 3) {
                        const more = document.createElement('div');
                        more.textContent = `ほか ${dailyTodos.length - 3}件`;
                        cell.appendChild(more);
                    }
                }
            } catch (error) {
                console.error('やることの読み込みに失敗しました', error);
            }
        }

        loadTodos();
        loadWeather();
    </script>
</body>
</html>
