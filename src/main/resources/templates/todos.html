<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-1">
</head>
<body>
    <div class="container">
        <a th:href="@{/admin/audit-logs}">管理者向け監査ログ</a>
        <p class="flash" th:if="${message}" th:text="${message}"></p>

        <h1 class="page-title" th:text="${trash ? '削除済みのやること' : 'やること一覧'}">やること一覧</h1>

        <a class="link" th:unless="${trash}" th:href="@{/todos(trash=1)}">削除済みを見る</a>
        <a class="link" th:if="${trash}" th:href="@{/todos}">一覧に戻る</a>
        <a class="btn" th:href="@{/todos/new}">新規登録</a>
        <a class="btn sub" th:href="@{/templates}">テンプレート</a>
        <a class="link" th:href="@{/calendar}">カレンダーで見る</a>

        <form class="search-bar" method="get" th:action="@{/todos}">
            <div>
                <label class="form-label" for="keyword">やることの名前</label>
                <input class="form-input" id="keyword" name="keyword" type="text" th:value="${keyword}">
            </div>

            <div>
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </div>

            <input th:if="${trash}" name="trash" type="hidden" value="1">
            <input name="order" type="hidden" th:value="${order}">
            <label for="showCompleted" th:unless="${trash}">
                <input id="showCompleted" name="showCompleted" type="checkbox" value="true" th:checked="${showCompleted}">
                完了したものも表示する
            </label>
            <button class="btn" type="submit">絞り込む</button>

            <a class="link" th:unless="${trash}" th:href="@{/todos(keyword=${keyword}, category=${category}, order='manual', showCompleted=${showCompleted})}">手動順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', showCompleted=${showCompleted}, trash=${trash ? 1 : null})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', showCompleted=${showCompleted}, trash=${trash ? 1 : null})}">期限が遠い順</a>
        </form>

        <a class="btn" th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted}, trash=${trash ? 1 : null})}">CSVを書き出す</a>

        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash ? '削除済みのやることはありません' : 'まだ1件も登録されていません'}"></p>

        <form id="bulk-delete-form" method="post" th:action="@{/todos/bulk-delete}"
              th:if="${!trash and !#lists.isEmpty(todos)}">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="category" th:value="${category}">
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="showCompleted" th:value="${showCompleted}">
            <input type="hidden" name="page" th:value="${currentPage}">
            <p>全選択は表示中のページが対象です。</p>
            <button id="bulk-delete-button" class="btn" type="submit" disabled>選択した項目を削除</button>
        </form>

        <p th:if="${!trash and order == 'manual'}">行をドラッグして並び替えできます（表示中のページ内）。</p>
        <p id="reorder-status" role="status" aria-live="polite"></p>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th th:unless="${trash}">
                        <label><input id="select-all" type="checkbox"> 全選択</label>
                    </th>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="todo-rows" th:attr="data-reorder-enabled=${!trash and order == 'manual'},data-reorder-url=@{/api/todo/reorder}">
                <tr th:each="todo : ${todos}" th:attr="data-id=${todo.id},draggable=${!trash and order == 'manual'},data-due-date=${todo.dueDate},data-completed=${todo.completed}">
                    <td th:unless="${trash}">
                        <input class="todo-select" type="checkbox" name="ids" th:value="${todo.id}"
                               form="bulk-delete-form" th:attr="aria-label=${todo.title + 'を選択'}">
                    </td>
                    <td><a th:unless="${trash}" th:href="@{/todos/{id}(id=${todo.id})}" th:text="${todo.title}"></a><span th:if="${trash}" th:text="${todo.title}"></span></td>
                    <td th:text="${todo.category}"></td>
                    <td>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : (todo.priority == 3 ? '低' : ''))}"></span>
                        <span class="priority-mark" th:if="${todo.priority == 1}" aria-hidden="true">★</span>
                    </td>
                    <td th:text="${todo.dueDate}"></td>
                    <td>
                        <span th:text="${todo.completed == true ? '完了' : '未完了'}"></span>
                        <span th:if="${todo.completed == true and todo.completedAt != null}"
                              th:text="${#temporals.format(todo.completedAt, 'yyyy-MM-dd')}"></span>
                    </td>
                    <td>
                        <form th:unless="${trash}" method="post" th:action="@{/todos/{id}/pin(id=${todo.id})}">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="category" th:value="${category}">
                            <input type="hidden" name="order" th:value="${order}">
                            <input type="hidden" name="showCompleted" th:value="${showCompleted}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button class="btn" type="submit" th:attr="aria-pressed=${todo.pinned}"
                                    th:text="${todo.pinned ? '印を外す' : '印を付ける'}">印を付ける</button>
                        </form>
                        <a class="link" th:unless="${trash}" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                        <a class="link" th:unless="${trash}" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
                        <form th:if="${trash}" method="post" th:action="@{/todos/{id}/restore(id=${todo.id}, trash=1)}">
                            <button class="btn" type="submit">戻す</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" aria-label="ページ選択" th:if="${totalPages > 1}">
            <th:block th:each="number : ${#numbers.sequence(1, totalPages)}">
                <span class="btn" aria-current="page" th:if="${number == currentPage}" th:text="${number}"></span>
                <a class="btn sub" th:unless="${number == currentPage}"
                   th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted}, page=${number}, trash=${trash ? 1 : null})}"
                   th:text="${number}"></a>
            </th:block>
        </nav>
    </div>
    <script th:src="@{/js/todo-reorder.js}" defer></script>
    <script>
        const bulkDeleteForm = document.getElementById('bulk-delete-form');
        if (bulkDeleteForm) {
            const selectAll = document.getElementById('select-all');
            const checkboxes = [...document.querySelectorAll('.todo-select')];
            const deleteButton = document.getElementById('bulk-delete-button');
            const updateSelection = () => {
                const count = checkboxes.filter(checkbox => checkbox.checked).length;
                selectAll.checked = count === checkboxes.length;
                selectAll.indeterminate = count > 0 && count < checkboxes.length;
                deleteButton.disabled = count === 0;
            };
            selectAll.addEventListener('change', () => {
                checkboxes.forEach(checkbox => { checkbox.checked = selectAll.checked; });
                updateSelection();
            });
            checkboxes.forEach(checkbox => checkbox.addEventListener('change', updateSelection));
            bulkDeleteForm.addEventListener('submit', event => {
                const count = checkboxes.filter(checkbox => checkbox.checked).length;
                if (count === 0 || !window.confirm(`選択した${count}件を削除しますか？`)) {
                    event.preventDefault();
                }
            });
            window.addEventListener('pageshow', updateSelection);
            updateSelection();
        }

        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        for (const row of document.querySelectorAll('.todo-table tbody tr')) {
            if (row.dataset.dueDate && row.dataset.dueDate < today && row.dataset.completed === 'false') {
                row.classList.add('todo-overdue');
            }
        }
    </script>
</body>
</html>
