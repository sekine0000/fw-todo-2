<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">編集内容の確認</h1>

        <p class="confirm-value">
            <strong>やること：</strong>
            <span th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}"></span>
        </p>
        <p class="confirm-value">
            <strong>メモ：</strong>
            <span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}"></span>
        </p>
        <p class="confirm-value">
            <strong>ジャンル：</strong>
            <span th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}"></span>
        </p>
        <p class="confirm-value">
            <strong>優先度：</strong>
            <span th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}"></span>
        </p>
        <p class="confirm-value">
            <strong>期限：</strong>
            <span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}"></span>
        </p>
        <p class="confirm-value">
            <strong>完了：</strong>
            <span th:text="${todo.completed == true ? '完了' : '未完了'}"></span>
        </p>

        <form class="confirm-actions" th:action="@{/todos/{id}(id=${todo.id})}" th:object="${todo}" method="post">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">
            <input type="hidden" th:field="*{completed}">
            <button class="btn" type="submit">保存する</button>
            <button class="btn sub" type="submit" th:formaction="@{/todos/{id}/edit(id=${todo.id})}">書き直す</button>
        </form>
    </div>
</body>
</html>
