<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除の確認</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-1">
</head>
<body>
    <div class="container">
        <h1 class="page-title">削除の確認</h1>

        <p class="confirm-value">
            <strong>やること：</strong>
            <span th:text="${todo.title}"></span>
        </p>
        <p class="confirm-value">
            <strong>ジャンル：</strong>
            <span th:text="${todo.category}"></span>
        </p>
        <p class="confirm-value">
            <strong>期限：</strong>
            <span th:text="${todo.dueDate}"></span>
        </p>

        <form class="confirm-actions" th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
            <button class="btn" type="submit">消す</button>
            <a class="btn sub" th:href="@{/todos}">やめる</a>
        </form>
    </div>
</body>
</html>
