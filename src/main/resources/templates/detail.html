<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css?v=20261126-1}">
</head>
<body>
<div class="container">
    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <h1 class="page-title" th:text="${todo.title}"></h1>
    <p th:text="${todo.detail}"></p>
    <p>ジャンル: <span th:text="${todo.category}"></span></p>
    <p>期限: <span th:text="${todo.dueDate}"></span></p>
    <p>状態: <span th:text="${todo.completed ? '完了' : '未完了'}"></span></p>
    <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
    <form method="post" th:action="@{/todo/{id}/duplicate(id=${todo.id})}">
        <label><input type="checkbox" name="includeSubtasks" value="true" checked> サブタスクも複製</label>
        <button class="btn" type="submit">複製</button>
    </form>
    <h2>サブタスク</h2>
    <p th:text="|進捗率: ${progress}%（${completedCount}/${#lists.size(subtasks)}件完了）|"></p>
    <progress max="100" th:value="${progress}" aria-label="サブタスクの進捗率"></progress>
    <p th:if="${#lists.isEmpty(subtasks)}">サブタスクはありません。</p>
    <ul>
        <li th:each="child : ${subtasks}">
            <span th:text="${child.title}"></span>
            <span th:text="${child.completed ? '完了' : '未完了'}"></span>
            <form method="post" th:action="@{/todos/{parentId}/subtasks/{id}/toggle(parentId=${todo.id},id=${child.id})}">
                <button class="btn" type="submit" th:text="${child.completed ? '未完了に戻す' : '完了にする'}"></button>
            </form>
            <form method="post" th:action="@{/todos/{parentId}/subtasks/{id}/delete(parentId=${todo.id},id=${child.id})}">
                <button class="btn" type="submit">削除</button>
            </form>
        </li>
    </ul>
    <form method="post" th:action="@{/todos/{id}/subtasks(id=${todo.id})}">
        <label for="subtask-title">サブタスク名</label>
        <input class="form-input" id="subtask-title" name="title" required maxlength="255">
        <button class="btn" type="submit">追加</button>
    </form>
    <a class="link" th:href="@{/todos}">一覧に戻る</a>
    <section id="task-dependencies" th:data-task-id="${todo.id}"
             th:data-api-url="@{/api/todos/{id}/dependencies(id=${todo.id})}">
        <h2>タスクの依存関係</h2>
        <p id="dependency-status" role="status" aria-live="polite"></p>
        <form id="dependency-form">
            <label for="prerequisite-select">前提タスク</label>
            <select id="prerequisite-select" class="form-input" required disabled></select>
            <button id="dependency-add" class="btn" type="submit" disabled>追加</button>
        </form>
        <ul id="prerequisite-list"></ul>
        <p id="dependency-message" role="alert"></p>
        <button id="dependency-reload" class="btn" type="button">再読み込み</button>
        <p>矢印は前提タスクから後続タスクを指します。現在のタスクにつながる依存関係を表示します。</p>
        <div style="overflow-x:auto">
            <svg id="dependency-graph" role="img" aria-label="タスクの依存関係グラフ"></svg>
        </div>
        <noscript>依存関係の操作とグラフ表示にはJavaScriptが必要です。</noscript>
    </section>
</div>
<script defer th:src="@{/js/task-dependencies.js}"></script>
</body>
</html>
