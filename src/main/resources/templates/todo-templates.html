<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoテンプレート</title>
    <link rel="stylesheet" href="/css/style.css?v=20261126-1">
</head>
<body>
<main class="container">
    <h1 class="page-title">ToDoテンプレート</h1>
    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <a class="btn" th:href="@{/templates/new}">テンプレートを作成</a>
    <a class="btn sub" th:href="@{/todos}">タスク一覧へ</a>
    <p th:if="${#lists.isEmpty(templates)}">テンプレートはまだありません。</p>
    <section th:each="template : ${templates}">
        <h2 th:text="${template.name}"></h2>
        <p th:text="${template.description}"></p>
        <ol><li th:each="item : ${template.items}" th:text="${item}"></li></ol>
        <form method="post" th:action="@{/templates/{id}/delete(id=${template.id})}"
              onsubmit="return confirm('このテンプレートを削除しますか？ 作成済みのタスクは残ります。')">
            <button class="btn sub" type="submit">テンプレートを削除</button>
        </form>
    </section>
    <section th:unless="${#lists.isEmpty(templates)}">
        <h2>テンプレートからタスクを一括作成</h2>
        <p>選択したテンプレートの各項目を、未完了のタスクとして作成します。</p>
        <form method="post" th:action="@{/templates/apply}" th:object="${taskForm}">
            <ul class="error" th:if="${#fields.hasAnyErrors()}">
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
            </ul>
            <div class="form-row">
                <label class="form-label" for="templateId">テンプレート</label>
                <select class="form-input" id="templateId" th:field="*{templateId}" required>
                    <option value="">選択してください</option>
                    <option th:each="template : ${templates}" th:value="${template.id}" th:text="${template.name}"></option>
                </select>
            </div>
            <div class="form-row">
                <label class="form-label" for="category">共通のジャンル</label>
                <select class="form-input" id="category" th:field="*{category}" required>
                    <option value="">選択してください</option>
                    <option th:each="category : ${ {'デザイン','マーケティング','プログラミング','資格','就職活動'} }" th:value="${category}" th:text="${category}"></option>
                </select>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority">共通の優先度</label>
                <select class="form-input" id="priority" th:field="*{priority}" required>
                    <option value="1">高</option><option value="2">中</option><option value="3">低</option>
                </select>
            </div>
            <div class="form-row">
                <label class="form-label" for="dueDate">共通の期限（任意）</label>
                <input class="form-input" id="dueDate" type="date" th:field="*{dueDate}">
                <p class="error" th:errors="*{dueDate}"></p>
            </div>
            <button class="btn" type="submit">タスクを一括作成</button>
        </form>
    </section>
</main>
</body>
</html>
